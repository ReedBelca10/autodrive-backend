version: '3.8'

services:
  backend:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional local MongoDB (uncomment if you want local DB instead of Atlas)
  # mongo:
  #   image: mongo:6.0
  #   restart: unless-stopped
  #   volumes:
  #     - mongo-data:/data/db

volumes:
  mongo-data:
